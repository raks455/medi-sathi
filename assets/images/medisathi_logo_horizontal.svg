<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 512" width="1440" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
